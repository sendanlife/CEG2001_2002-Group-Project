<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Sign Up — MediTrack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
        }
        .card {
            background: white; border-radius: 16px; padding: 40px;
            width: 100%; max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; font-size: 40px; margin-bottom: 10px; }
        h1 { text-align: center; color: #333; font-size: 24px; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 14px; font-size: 14px;
            border: 2px solid #e0e0e0; border-radius: 8px;
        }
        input:focus { outline: none; border-color: #2a5298; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white; font-size: 15px; font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.95; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .link a { color: #2a5298; text-decoration: none; font-weight: 600; }
        .error {
            background: #ffe6e6; color: #c0392b; padding: 12px;
            border-radius: 8px; margin-bottom: 15px; font-size: 13px;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🩺</div>
        <h1>Staff Registration</h1>
        <p class="subtitle">Create your medical staff account</p>

        <div class="error" id="error-box"></div>

        <form id="signup-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Dr. Sarah Tan">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="sarah@hospital.sg">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" required placeholder="+65 9123 4567">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required minlength="8" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm" required placeholder="Repeat password">
            </div>
            <button type="submit" class="btn" id="submit-btn">Create Staff Account</button>
        </form>

        <p class="link">Already registered? <a href="/staff/login">Log In</a></p>
    </div>

    <script>
        const API_URL = '/api';
        const form = document.getElementById('signup-form');
        const errorBox = document.getElementById('error-box');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');

            const pw = document.getElementById('password').value;
            const cf = document.getElementById('confirm').value;
            if (pw !== cf) return showError('Passwords do not match');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim().toLowerCase(),
                phoneNumber: document.getElementById('phone').value.trim(),
                password: pw,
            };

            try {
                const res = await fetch(`${API_URL}/staff/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const result = await res.json();

                if (!result.success) return showError(result.message);

                localStorage.setItem('staff_token', result.data.token);
                localStorage.setItem('staff', JSON.stringify(result.data.staff));
                window.location.href = '/staff/dashboard';
            } catch (err) {
                showError('Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Staff Account';
            }
        });

        function showError(msg) {
            errorBox.textContent = '⚠️ ' + msg;
            errorBox.classList.add('show');
        }
    </script>
</body>
</html>
