<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediTrack — Welcome</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: white; border-radius: 20px; padding: 50px 40px;
            width: 100%; max-width: 640px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
            text-align: center;
        }
        .logo { font-size: 64px; margin-bottom: 15px; }
        h1 {
            color: #1e3c72; font-size: 32px;
            margin-bottom: 10px; letter-spacing: -0.5px;
        }
        .subtitle {
            color: #888; font-size: 16px; margin-bottom: 40px;
        }
        .choice-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 20px;
        }
        .choice {
            padding: 30px 20px; border-radius: 16px; text-decoration: none;
            color: white; transition: all 0.25s;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .choice:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.18);
        }
        .choice.staff { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .choice.patient { background: linear-gradient(135deg, #667eea, #764ba2); }
        .choice-icon { font-size: 48px; }
        .choice-title { font-size: 20px; font-weight: 700; }
        .choice-desc {
            font-size: 13px; opacity: 0.85;
            text-align: center; line-height: 1.4;
        }
        .footer {
            margin-top: 30px; padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px; color: #aaa;
        }
        @media (max-width: 500px) {
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">💊</div>
        <h1>MediTrack</h1>
        <p class="subtitle">Smart Medication Management System</p>

        <div class="choice-grid">
            <a href="/staff/login" class="choice staff">
                <div class="choice-icon">🩺</div>
                <div class="choice-title">Medical Staff</div>
                <div class="choice-desc">Manage patients, prescriptions & schedules</div>
            </a>

            <a href="/login" class="choice patient">
                <div class="choice-icon">👤</div>
                <div class="choice-title">Patient</div>
                <div class="choice-desc">View your medication dashboard</div>
            </a>
        </div>

        <div class="footer">
            MediTrack &copy; 2026 · IoT Medication Dispenser
        </div>
    </div>
</body>
</html>
